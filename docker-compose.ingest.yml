# Local-path ingest: process multi-GB sources where they already sit, instead
# of uploading them through the browser.
#
#   REPLAY_DIR=/path/to/your/recordings \
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#                  -f docker-compose.ingest.yml up -d
#
# Then POST /api/process with local_path=<name>, resolved relative to the mount
# below. A 3-hour live recording is 6-12GB, an order of magnitude past
# MAX_FILE_SIZE_MB, and uploading it would copy the whole file a second time
# only to be refused with a 413.
services:
  backend:
    volumes:
      # Read-only deliberately: the pipeline only ever reads its source, and ro
      # turns "we checked the code doesn't delete it" into a kernel guarantee.
      # `:?` fails the command loudly when REPLAY_DIR is unset rather than
      # silently mounting some default directory as the ingest root.
      - ${REPLAY_DIR:?set REPLAY_DIR to the folder holding your source videos}:/replays:ro
    environment:
      # Presence of this is what enables the feature at all (app.py refuses the
      # local_path parameter when it is empty, and whenever billing is on).
      - LOCAL_INGEST_DIR=/replays
