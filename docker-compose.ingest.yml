# Local-path ingest: process multi-GB sources where they already sit, instead
# of uploading them through the browser.
#
#   REPLAY_DIR=/path/to/recordings INBOX_DIR=/path/to/dropbox \
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#                  -f docker-compose.ingest.yml up -d
#
# Then pick a file in the dashboard's "On Server" tab, or POST /api/process
# with local_path=<name>, resolved relative to LOCAL_INGEST_DIR. A 3-hour live
# recording is 6-12GB, an order of magnitude past MAX_FILE_SIZE_MB, and
# uploading it would copy the whole file a second time only to be refused with
# a 413.
#
# Several source folders are mounted as siblings under one root rather than
# configured as a list: the listing walks subdirectories, so they all show up
# (prefixed by the folder name) while LOCAL_INGEST_DIR stays a single directory
# and containment stays a single realpath comparison. Add a line here to add a
# source; nothing in app.py has to know.
services:
  backend:
    volumes:
      # Read-only deliberately: the pipeline only ever reads its source, and ro
      # turns "we checked the code doesn't delete it" into a kernel guarantee.
      #
      # `:?` fails the command loudly when a variable is unset — but it only
      # checks the *variable*, not that the path is a real mount, and that gap
      # cost a silent outage: on a WSL host whose source lived on a Google Drive
      # letter, the drive was not mounted yet at container start, Docker created
      # the missing directory on the host root, and the ingest tab quietly listed
      # nothing from it for days. `create_host_path: false` is the other half:
      # the container now refuses to start instead of mounting an empty
      # placeholder. With `restart: unless-stopped` that turns into a repair
      # loop — it keeps retrying and comes up as soon as the mount is there,
      # because binds are re-resolved on every `docker start`.
      - type: bind
        source: ${REPLAY_DIR:?set REPLAY_DIR to the folder holding your recordings}
        target: /ingest/replays
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${INBOX_DIR:?set INBOX_DIR to the folder you drop new sources into}
        target: /ingest/inbox
        read_only: true
        bind: { create_host_path: false }
    environment:
      # Presence of this is what enables the feature at all (app.py refuses the
      # local_path parameter when it is empty, and whenever billing is on).
      - LOCAL_INGEST_DIR=/ingest
      #
      # A source on a slow mount (9p/drvfs under WSL, cifs, a streamed cloud
      # drive) is copied to local disk before the pipeline touches it. That is
      # not one read being optimised: ffprobe, the audio extraction, the scene
      # detector decoding the whole file, the layout picker's twelve seeks, then
      # one decode per clip at extraction and another at reframe all go back over
      # the wire. One sequential copy replaces the lot.
      #
      # The choice is automatic: local_stage reads the filesystem type from
      # /proc/self/mountinfo, where a Docker bind mount reports the underlying
      # superblock — so /ingest/replays shows up as 9p and /ingest/inbox as ext4,
      # and only the first is copied. Set always/never to override.
      # The copies land in ./stage inside the repo bind mount, so there is no
      # extra volume to configure; point LOCAL_STAGE_DIR elsewhere for a
      # dedicated NVMe.
      # - LOCAL_STAGE=auto
      # - LOCAL_STAGE_MAX_GB=50           # ~4 recordings of 3h, LRU eviction
      # - LOCAL_STAGE_TTL_SECONDS=43200   # 12h since last use; <=0 disables the sweep
      #
      # Batch jobs (several files submitted at once) run in their own lane so a
      # file you launch by hand never queues behind thirty of them.
      # - LOCAL_BATCH_CONCURRENCY=1
